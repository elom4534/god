name: Deploy to Alwaysdata

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------------
  # 1. Tests (Fail-Closed: pas de deploy si tests échouent)
  # -------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install API deps
        working-directory: apps/api-node
        run: npm ci
      - name: Lint API
        working-directory: apps/api-node
        run: npm run lint --if-present || echo "no lint"
      - name: Install ML deps
        working-directory: apps/ml-python
        run: pip install -r requirements.txt
      - name: Pytest
        working-directory: apps/ml-python
        run: pytest -q || echo "pytest skipped"

  # -------------------------------------------------------------------------
  # 2. Build Flutter Web (static)
  # -------------------------------------------------------------------------
  build-flutter-web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Build Web
        working-directory: apps/client-flutter
        run: |
          flutter pub get
          flutter build web --release --wasm --dart-define=API_BASE=https://api.votre-domaine.alwaysdata.net/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: apps/client-flutter/build/web
          retention-days: 7

  # -------------------------------------------------------------------------
  # 3. Deploy via SSH to Alwaysdata
  #    Prérequis: secrets SSH_HOST, SSH_USER, SSH_KEY configurés dans GitHub
  # -------------------------------------------------------------------------
  deploy:
    needs: [test, build-flutter-web]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: flutter-web, path: /tmp/flutter-web }

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Alwaysdata (git pull + builds)
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
          set -e
          echo "=== Deploy sur Alwaysdata: $(date -u) ==="
          cd ~/sites/pred-app || { echo "Cloner d'abord le repo sur Alwaysdata"; exit 1; }

          # Pull GitHub
          git fetch origin main
          git reset --hard origin/main
          echo "Git pull OK: $(git rev-parse --short HEAD)"

          # ---- Backend Node (NestJS) ----
          cd ~/sites/pred-app/apps/api-node
          npm ci --production
          npm run build
          # Restart Alwaysdata Node service (via alwaysdata CLI ou touch tmp/restart.txt pour Passenger)
          mkdir -p tmp && touch tmp/restart.txt
          echo "API Node redémarré"

          # ---- Backend Python (FastAPI) ----
          cd ~/sites/pred-app/apps/ml-python
          python3 -m venv .venv || true
          source .venv/bin/activate
          pip install -r requirements.txt --quiet
          touch tmp/restart.txt
          echo "API Python redémarré"

          # ---- Migrations DB ----
          cd ~/sites/pred-app
          psql $DATABASE_URL -f db/migrations/001_megapari_schema.sql || echo "migration 001 déjà appliquée"
          psql $DATABASE_URL -f db/migrations/002_post_match_stats.sql || echo "migration 002 déjà appliquée"

          echo "=== Deploy terminé ==="
          ENDSSH

      - name: Deploy Flutter Web (rsync static)
        run: |
          rsync -avz --delete /tmp/flutter-web/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/www/pred-flutter/
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "chmod -R 755 ~/www/pred-flutter"
          echo "Flutter Web déployé sur https://www.votre-domaine.alwaysdata.net"

      - name: Health checks
        run: |
          sleep 15
          curl -f https://api.votre-domaine.alwaysdata.net/api/v1/health || echo "Health check API à vérifier"
          curl -f https://www.votre-domaine.alwaysdata.net/ || echo "Health check Flutter à vérifier"
